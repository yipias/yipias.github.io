<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 Siguiendo viaje Yipias</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #F5F7FA; 
            color: #1A1A1A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .header {
            width: 100%;
            background: #0078D7;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(0,120,215,0.3);
        }
        .header h1 { font-size: 20px; margin-bottom: 6px; }
        .header p { font-size: 14px; opacity: 0.95; }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }
        .ruta { 
            font-size: 15px; 
            color: #333; 
            margin: 12px 0;
            line-height: 1.6;
        }
        .estado { 
            font-size: 14px; 
            color: #C9A227; 
            font-weight: 700;
            margin-top: 12px;
            padding: 8px;
            background: #FFF9E6;
            border-radius: 8px;
            text-align: center;
        }
        
        .btn-app {
            display: block;
            width: 100%;
            background: #0078D7;
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            margin: 10px 0;
            box-shadow: 0 2px 8px rgba(0,120,215,0.3);
        }
        .btn-app:hover {
            background: #005a9e;
        }
        .btn-play {
            background: #4CAF50;
        }
        .btn-play:hover {
            background: #3d8b40;
        }
        
        .footer {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: auto;
            padding: 20px;
        }
        .escudo {
            width: 28px;
            height: 28px;
            vertical-align: middle;
            margin-right: 6px;
        }
        .loader {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 16px;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1d2c33; color: #fff; }
            .card { background: #2c3e50; }
            .ruta { color: #B0B6C2; }
            .estado { background: #3d3618; color: #C9A227; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚗 Siguiendo viaje Yipias</h1>
        <p>En tiempo real • Seguro • Premium 🇵</p>
    </div>

    <div class="card">
        <div id="loading" class="loader">
            🔍 Buscando viaje...
        </div>
        
        <div id="contenido" style="display:none;">
            <div class="ruta" id="txtRuta">
                📍 Cargando origen...<br>
                🏁 Cargando destino...
            </div>
            <div class="estado" id="txtEstado">
                Estado: Conectando...
            </div>
        </div>
    </div>

    <!-- Botón para abrir la app -->
    <a id="btnAbrirApp" class="btn-app" href="#">
        📱 Abrir en la app Yipias
    </a>
    
    <!-- Botón para descargar si no tiene la app -->
    <a href="https://play.google.com/store/apps/details?id=com.yipias.cliente&hl=es_PE" 
       class="btn-app btn-play" target="_blank">
        📥 Descargar app gratis
    </a>

    <div class="footer">
        <strong>Yipias</strong> • Transporte seguro en Perú<br>
        © 2026 Todos los derechos reservados
    </div>

    <script>
        // 🔹 OBTENER ID DEL PEDIDO DESDE LA URL
        const params = new URLSearchParams(window.location.search);
        const pedidoId = params.get('id') || window.location.pathname.split('/').pop().replace('.html', '');
        
        if (!pedidoId || pedidoId === 'track') {
            document.getElementById('loading').innerHTML = 
                '<div class="error">❌ Enlace no válido<br><small>Verifica el ID del viaje</small></div>';
        } else {
            // 🔹 CONFIGURAR LINK PARA ABRIR LA APP
            const deepLink = `yipias://track/${pedidoId}`;
            document.getElementById('btnAbrirApp').href = deepLink;
            
            // 🔹 INTENTAR ABRIR LA APP AUTOMÁTICAMENTE (después de 1 segundo)
            setTimeout(() => {
                window.location.href = deepLink;
            }, 1000);
            
            // 🔹 LEER DATOS BÁSICOS DESDE FIREBASE
            const dbURL = `https://yipias-web-f06e1-default-rtdb.firebaseio.com/pedidos/${pedidoId}.json`;
            
            fetch(dbURL)
                .then(res => {
                    if (!res.ok) throw new Error('Viaje no encontrado');
                    return res.json();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('contenido').style.display = 'block';
                    
                    if (data && data.estado) {
                        const origen = data.origen_texto || 'Origen no disponible';
                        const destino = data.destino_texto || 'Destino no disponible';
                        const estado = data.estado || 'Desconocido';
                        const conductor = data.conductor_nombre || 'Conductor';
                        
                        document.getElementById('txtRuta').innerHTML = 
                            `📍 ${origen}<br><br>🏁 ${destino}<br><br>🚖 ${conductor}`;
                        document.getElementById('txtEstado').textContent = 
                            `🚦 Estado: ${estado.replace('_', ' ').toUpperCase()}`;
                    } else {
                        throw new Error('Datos incompletos');
                    }
                })
                .catch(err => {
                    console.log('Error:', err);
                    document.getElementById('loading').innerHTML = 
                        '<div class="error">⚠️ No se pudo cargar la información<br><small>El viaje puede haber finalizado</small></div>';
                });
        }
    </script>
</body>
</html>
