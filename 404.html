<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo...</title>
    <script>
        var path = window.location.pathname;
        
        if (path.includes('terminos') || path.includes('terminoscondiciones')) {
            window.location.href = 'https://yipias.com/#/términos';
        } 
        else if (path.includes('politicas') || path.includes('politicaseguridad') || path.includes('privacidad')) {
            window.location.href = 'https://yipias.com/#/privacidad';
        }
        else {
            window.location.href = 'https://yipias.com';
        }
    </script>
</head>
<body>
    <p>Redirigiendo... Si no funciona, <a href="https://yipias.com">haz clic aquí</a>.</p>
</body>
</html>
