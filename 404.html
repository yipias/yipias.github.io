<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo...</title>
    <style>
        html.qr-landing-active,
        html.qr-landing-active body {
            min-height: 100%;
            margin: 0;
            background: #08090b;
        }
        html.qr-landing-active body {
            min-height: 100vh;
            color: #f5f6f7;
            font-size: 0;
        }
        #qr-transition { display: none; }
        html.qr-landing-active #fallback-message { display: none; }
        html.qr-landing-active #qr-transition {
            box-sizing: border-box;
            display: flex;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 28px 24px;
            color: #f5f6f7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
        }
        #qr-transition .brand {
            color: #f9bd32;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }
        #qr-transition .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(255, 255, 255, 0.22);
            border-top-color: #f9bd32;
            border-radius: 50%;
            animation: qr-spin 0.8s linear infinite;
        }
        #qr-transition h1 {
            max-width: 18ch;
            margin: 0;
            font-size: clamp(1.8rem, 7.5vw, 2.7rem);
            font-weight: 750;
            line-height: 1.15;
        }
        #qr-transition p {
            max-width: 34ch;
            margin: 0;
            color: #c7c9cc;
            font-size: clamp(1.05rem, 4.5vw, 1.25rem);
            line-height: 1.5;
        }
        #qr-status {
            color: #f5f6f7;
            font-size: 1rem;
        }
        @keyframes qr-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            #qr-transition .spinner { animation-duration: 2s; }
        }
    </style>
    <script>
        (function () {
            var qrMatch = /^\/v\/([a-fA-F0-9]{40})$/.exec(window.location.pathname);
            if (qrMatch) {
                document.documentElement.classList.add('qr-landing-active');
                window.__YIPIAS_QR_TOKEN__ = qrMatch[1];
                document.addEventListener('DOMContentLoaded', function () {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = '/qr/landing.js';
                    document.head.appendChild(script);
                }, { once: true });
                return;
            }

            // Fallback actual del 404: conservar este bloque sin cambios.
            var path = window.location.pathname;
            if (path.includes('politicas') || path.includes('privacidad')) {
                window.location.href = 'https://yipias.com/politicasseguridad.html';
            } else {
                window.location.href = 'https://yipias.com/terminoscondiciones.html';
            }
        })();
    </script>
</head>
<body>
    <span id="fallback-message">Redirigiendo...</span>
    <main id="qr-transition" role="status" aria-live="polite">
        <div class="brand" aria-hidden="true">YipiAs</div>
        <div class="spinner" aria-hidden="true"></div>
        <h1>Preparando tu descarga…</h1>
        <p>Te llevaremos a la tienda de YipiAs Pasajero.</p>
        <span id="qr-status" class="visually-hidden"></span>
    </main>
</body>
</html>
